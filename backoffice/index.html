<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livraison — Back-office Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Écran de connexion -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <h1>Back-office Livraison</h1>
      <p class="subtitle">Connexion administrateur</p>

      <label for="api-base">URL de l'API</label>
      <input type="text" id="api-base" placeholder="http://127.0.0.1:8000" />

      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="admin@livraison.td" />

      <label for="password">Mot de passe</label>
      <input type="password" id="password" required placeholder="••••••••" />

      <button type="submit">Se connecter</button>
      <p id="login-error" class="error-message"></p>

      <p class="hint">
        Identifiants par défaut au premier démarrage du backend :
        <code>admin@livraison.td</code> / <code>admin1234</code> — à changer
        via la variable d'environnement <code>ADMIN_PASSWORD</code>.
      </p>
    </form>
  </div>

  <!-- Application -->
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">🚚 Livraison</div>
      <nav>
        <a href="#/dashboard" data-route="dashboard">Tableau de bord</a>
        <a href="#/couriers" data-route="couriers">Livreurs</a>
        <a href="#/zones" data-route="zones">Tarifs &amp; zones</a>
        <a href="#/orders" data-route="orders">Commandes</a>
        <a href="#/disputes" data-route="disputes">Litiges</a>
      </nav>
      <button id="logout-btn" class="logout-btn">Se déconnecter</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <h2 id="page-title">Tableau de bord</h2>
        <span id="connection-status" class="status-pill">connecté</span>
      </header>
      <div id="app-content" class="app-content">
        <!-- injecté par js/app.js -->
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

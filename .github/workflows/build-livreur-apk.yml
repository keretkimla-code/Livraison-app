name: Build Livreur APK

on:
  push:
    branches: [ main ]
    paths:
      - 'livreur/**'
      - '.github/workflows/build-livreur-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livreur
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing platform folders
        run: flutter create . --platforms=android --org com.livraison

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: livraison-livreur-debug-apk
          path: livreur/build/app/outputs/flutter-apk/app-debug.apk